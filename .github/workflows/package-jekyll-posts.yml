# Reusable workflow: package a Jekyll repo's posts into a versioned,
# reviewable content package on a dedicated branch.
#
# Callers (Jekyll repos in this org) invoke it from their own workflow:
#
#   jobs:
#     package:
#       uses: many-blogs/.github/.github/workflows/package-jekyll-posts.yml@main
#       with:
#         site_id: lanark
#       permissions:
#         contents: write
#
# The caller MUST grant `contents: write`: the workflow force-pushes the
# package branch. See PACKAGING.md in this repo for the full contract:
# package format, normalization rules, and the engine handoff.
name: Package Jekyll posts

on:
  workflow_call:
    inputs:
      site_id:
        description: Site identifier recorded in the package manifest (for example "lanark").
        required: true
        type: string
      posts_dir:
        description: Directory holding Jekyll posts, relative to the caller repo root.
        default: "_posts"
        type: string
      builders_dir:
        description: Directory holding builder review files, relative to the caller repo root. Empty string skips builders.
        default: "builders"
        type: string
      package_branch:
        description: Branch the package tree is force-pushed to (orphan commits).
        default: "content-package"
        type: string
      packager_ref:
        description: Ref of many-blogs/.github to fetch the packager script from. Defaults to main; override only to test unmerged packager changes.
        default: "main"
        type: string

permissions:
  contents: write

concurrency:
  group: package-${{ github.repository }}-${{ inputs.site_id }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out caller repo
        uses: actions/checkout@v5

      - name: Check out packager
        uses: actions/checkout@v5
        with:
          repository: many-blogs/.github
          ref: ${{ inputs.packager_ref }}
          path: .packager

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .packager/packager/package-lock.json

      - name: Install packager dependencies
        working-directory: .packager/packager
        run: npm ci --no-audit --no-fund

      - name: Build package
        env:
          SITE_ID: ${{ inputs.site_id }}
          POSTS_DIR: ${{ inputs.posts_dir }}
          BUILDERS_DIR: ${{ inputs.builders_dir }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node .packager/packager/package.mjs \
            --site-id "$SITE_ID" \
            --source-dir "$GITHUB_WORKSPACE" \
            --out-dir "$RUNNER_TEMP/package" \
            --posts-dir "$POSTS_DIR" \
            --builders-dir "$BUILDERS_DIR" \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$REF_NAME" \
            --sha "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Publish package branch
        env:
          PACKAGE_BRANCH: ${{ inputs.package_branch }}
          SITE_ID: ${{ inputs.site_id }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git fetch origin "$PACKAGE_BRANCH" 2>/dev/null || true
          # Build the package tree in a throwaway index so the caller's
          # worktree and index are never touched.
          export GIT_INDEX_FILE="$RUNNER_TEMP/package-index"
          rm -f "$GIT_INDEX_FILE"
          git --work-tree="$RUNNER_TEMP/package" add -A
          tree_sha="$(git write-tree)"
          existing_tree="$(git rev-parse --verify "origin/$PACKAGE_BRANCH^{tree}" 2>/dev/null || true)"
          if [ "$tree_sha" = "$existing_tree" ]; then
            echo "Package tree unchanged; skipping push."
            exit 0
          fi
          summary="$(node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/package/manifest.json","utf8"));console.log(`Posts: ${m.counts.posts}, builders: ${m.counts.builders}`);')"
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          commit_sha="$(git commit-tree "$tree_sha" \
            -m "Package $SITE_ID content from $GITHUB_SHA" \
            -m "Source: $GITHUB_REPOSITORY@$REF_NAME $GITHUB_SHA" \
            -m "$summary. Generated by package-jekyll-posts; do not edit by hand.")"
          git push origin "$commit_sha:refs/heads/$PACKAGE_BRANCH" --force
          echo "Pushed $commit_sha to $PACKAGE_BRANCH"
